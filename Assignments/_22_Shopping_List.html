<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h2>Shopping List</h2>

        <input type="text" id="item" placeholder="Enter item">
        <button id="addBtn">Add</button>

        <ul id="list"></ul>
    </div>

    <script>
        //         Create a shopping list where users can add and remove shopping items.
        // Constraints:
        // Users should be able to add shopping items to the list.
        // Users should be able to remove shopping items from the list.
        // Prevent empty entries from being added to the list.
        let input = document.getElementById("item");
        let addBtn = document.getElementById("addBtn");
        let list = document.getElementById("list");

        addBtn.addEventListener("click", function () {

            let value = input.value.trim();

            if (value === "") {
                alert("Please enter an item");
                return;
            }

            let li = document.createElement("li");
            li.innerText = value;

            let del = document.createElement("button");
            del.innerText = "Remove";
            del.className = "delete";

            del.addEventListener("click", function () {
                li.remove();
            });

            li.appendChild(del);
            list.appendChild(li);

            input.value = "";
            input.focus();

        });
    </script>
</body>

</html>
